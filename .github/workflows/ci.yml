name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# CI cannot modify the repository or access deployment secrets.
permissions:
  contents: read

# Older runs for the same PR/branch are superseded by new commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and quality tools
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Unit and integration tests with branch coverage
        run: |
          coverage run --branch --source=opencareerops -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=80
      - name: Validate fictional input end to end
        run: |
          python -m opencareerops \
            --input examples/fictional_career_state.json \
            --output "${{ runner.temp }}/career_report.md" \
            --today 2026-10-14
          grep -q '## Top priorities' "${{ runner.temp }}/career_report.md"

  package:
    name: package-smoke
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel in clean environment and run CLI
        shell: bash
        run: |
          python -m venv "${{ runner.temp }}/smoke-venv"
          "${{ runner.temp }}/smoke-venv/bin/python" -m pip install --no-deps dist/opencareerops-*.whl
          cd "${{ runner.temp }}"
          ./smoke-venv/bin/opencareerops \
            --input "$GITHUB_WORKSPACE/examples/fictional_career_state.json" \
            --output "$RUNNER_TEMP/installed_report.md" \
            --today 2026-10-14
          grep -q '## Top priorities' "$RUNNER_TEMP/installed_report.md"
      - uses: actions/upload-artifact@v7
        with:
          name: opencareerops-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [lint, tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Ensure every required job succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          echo "lint=$LINT_RESULT tests=$TEST_RESULT package=$PACKAGE_RESULT"
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
