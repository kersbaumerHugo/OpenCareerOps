[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencareerops"
version = "0.1.0.dev0"
description = "Explainable career reviews and action prioritization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
opencareerops = "opencareerops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
