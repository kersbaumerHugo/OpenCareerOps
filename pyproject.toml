[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencareerops"
version = "0.1.0.dev0"
description = "Explainable career reviews and action prioritization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
opencareerops = "opencareerops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["opencareerops"]

[tool.coverage.report]
show_missing = true
fail_under = 80
